<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1a17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pinakes Vitae">
  <meta
    name="description"
    content="A private-thinking workspace for everyday life, projects, diagrams, travel planning, literature analysis, architecture, and signed PDFs."
  >
  <title>Pinakes Vitae · Workspace</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/pinakes-vitae-logo-final-light.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/app-icon-192.png">
  <link rel="stylesheet" href="workspace.css?v=17">
  <link rel="stylesheet" href="site-navigation.css?v=17">
  <script type="module" src="site-navigation.js?v=5"></script>
</head>
<body class="workspace-body">
  <a class="skip-link" href="#app-main">Skip to workspace</a>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Pinakes Vitae home">
      <span class="brand-mark" aria-hidden="true">PV</span>
      <span>Pinakes Vitae</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="workspace.html#area=everyday" data-site-area="everyday">Everyday Life</a>
      <a href="research-literature.html">Research &amp; Literature</a>
      <a href="workspace.html#area=studies" data-site-area="studies">Studies &amp; Projects</a>
      <a href="workspace.html#area=tools" data-site-area="tools">Workspace</a>
      <a href="download-app.html">Download App</a>
    </nav>
  </header>

  <div class="app-shell">
    <div class="app-frame">
      <main class="app-main" id="app-main" tabindex="-1"></main>
    </div>
  </div>

  <dialog class="app-dialog app-dialog-wide" id="item-dialog">
    <form method="dialog" id="item-form">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow" id="item-dialog-eyebrow">NEW ENTRY</p>
          <h2 id="item-dialog-title">Add entry</h2>
        </div>
        <button class="icon-button dialog-close" type="button" data-dialog-close aria-label="Close">×</button>
      </div>
      <div id="item-form-fields"></div>
      <div class="dialog-actions">
        <button class="button button-quiet" type="button" data-dialog-close>Cancel</button>
        <button class="button button-primary" type="submit" value="default">Save entry</button>
      </div>
    </form>
  </dialog>

  <dialog class="app-dialog app-dialog-compact" id="password-dialog">
    <form method="dialog" id="password-form">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">CONFIRM DELETE</p>
          <h2 id="password-dialog-title">Delete this item?</h2>
        </div>
        <button class="icon-button dialog-close" type="button" data-dialog-close aria-label="Close">×</button>
      </div>
      <p class="dialog-copy">Enter the delete password to continue.</p>
      <label>
        Password
        <input name="password" type="password" required autocomplete="off">
      </label>
      <p class="form-error" id="password-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="button button-quiet" type="button" data-dialog-close>Cancel</button>
        <button class="button button-danger" type="submit" value="default">Delete</button>
      </div>
    </form>
  </dialog>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script type="module" src="app/main.js"></script>
</body>
</html>
