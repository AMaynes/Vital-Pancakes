<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vital Pancakes AI Bridge Settings</title>
  <link rel="stylesheet" href="extension.css">
</head>
<body>
  <main>
    <h1>Vital Pancakes AI Bridge</h1>
    <p>Paste the private token created by <code>npm run setup</code>. It stays in this extension’s local browser storage.</p>
    <form id="settings-form">
      <label>
        Pairing token
        <input id="pairing-token" name="pairingToken" type="password" autocomplete="off" spellcheck="false" required>
      </label>
      <label>
        Local gateway port
        <input id="gateway-port" name="gatewayPort" type="number" min="1" max="65535" required>
      </label>
      <div class="actions">
        <button type="submit">Save pairing</button>
        <button id="clear-pairing" class="secondary" type="button">Forget pairing</button>
      </div>
      <p id="settings-message" class="message" role="status"></p>
    </form>
    <section>
      <h2>Extension ID</h2>
      <code id="extension-id"></code>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
