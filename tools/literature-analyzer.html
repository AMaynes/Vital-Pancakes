<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <title>Literature Analyzer · Vital Pancakes</title>
  <link rel="icon" href="../assets/vital-pancakes-logo-transparent-black.png?v=1" type="image/png">
  <link rel="icon" href="../assets/vital-pancakes-logo-transparent-black.png?v=1" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="../assets/vital-pancakes-logo-transparent-white.png?v=1" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="../workspace.css?v=17">
  <link rel="stylesheet" href="tool.css?v=23">
  <link rel="stylesheet" href="literature-analyzer.css?v=8">
  <link rel="stylesheet" href="../site-navigation.css?v=24">
  <script type="module" src="../site-navigation.js?v=18"></script>
</head>
<body class="tool-body">
  <a class="skip-link" href="#tool-main">Skip to tool</a>

  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="Vital Pancakes home">
      <span class="brand-mark" aria-hidden="true">VP</span>
      <span>Vital Pancakes</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="../workspace.html#area=everyday">Everyday Life</a>
      <a href="../research-literature.html">Research &amp; Literature</a>
      <a href="../workspace.html#area=studies">Studies &amp; Projects</a>
      <a href="../workspace.html#area=tools" aria-current="page">Workspace</a>
      <a href="../download-app.html">Download App</a>
    </nav>
  </header>

  <div class="tool-shell analyzer-shell">
    <header class="tool-topbar">
      <div class="tool-title-group">
        <div>
          <h1>Literature Analyzer</h1>
          <small>READ · HIGHLIGHT · COMMENT · EXPORT</small>
        </div>
      </div>
      <div class="tool-topbar-actions">
        <span class="tool-save-status" id="analyzer-status" aria-live="polite">No source open</span>
        <button class="button button-quiet" id="clear-highlights" type="button" disabled>Clear marks</button>
        <button class="button button-quiet" id="export-analysis-png" type="button" disabled>Export PNG</button>
        <button class="button button-primary" id="export-analysis-pdf" type="button" disabled>Export PDF</button>
      </div>
    </header>

    <main class="literature-analyzer-workspace" id="tool-main">
      <section class="analyzer-viewer">
        <div class="tool-toolbar analyzer-toolbar">
          <div class="analyzer-ink-tools">
            <div class="analyzer-ink-colors" role="radiogroup" aria-label="Highlight ink color">
              <span>Highlight ink</span>
              <button class="highlight-color is-active" type="button" data-highlight-color="#f6d84a" aria-label="Yellow" aria-checked="true" role="radio"></button>
              <button class="highlight-color" type="button" data-highlight-color="#f29ca3" aria-label="Rose" aria-checked="false" role="radio"></button>
              <button class="highlight-color" type="button" data-highlight-color="#8ecae6" aria-label="Blue" aria-checked="false" role="radio"></button>
              <button class="highlight-color" type="button" data-highlight-color="#9ed6a5" aria-label="Green" aria-checked="false" role="radio"></button>
            </div>
            <button class="tool-button highlight-delete" id="delete-highlight" type="button" title="Delete selected highlight and comment" aria-label="Delete selected highlight and comment" disabled>&#128465;</button>
          </div>
          <button class="tool-button analyzer-comment-mode-toggle" id="comment-display-toggle" type="button" title="Show comments only while hovering over highlights">Comments: Side</button>
        </div>

        <div class="analyzer-reading-area" id="analyzer-reading-area">
          <div class="analyzer-stage-scroll">
            <label class="pdf-empty analyzer-empty" id="analysis-pdf-drop-zone">
              <input id="analysis-pdf-file" type="file" accept="application/pdf,.pdf">
              <span>⌑</span>
              <h2>Drop a PDF here</h2>
              <p>or click anywhere in this area to browse</p>
            </label>

            <div class="analyzer-document-layout">
              <aside class="analyzer-drawing-column" id="analyzer-drawing-column" aria-label="Drawing area" hidden>
                <button class="tool-button analyzer-drawing-toggle" id="drawing-visibility-toggle" type="button" aria-expanded="true">Hide drawing</button>
                <div class="analyzer-drawing-panel" id="analyzer-drawing-panel">
                  <div class="analyzer-drawing-tools" role="toolbar" aria-label="Drawing tools">
                    <button class="tool-button is-active" type="button" data-drawing-tool="pen">Pen</button>
                    <button class="tool-button" type="button" data-drawing-tool="eraser">Eraser</button>
                    <input id="drawing-color" type="color" value="#1b1d1a" aria-label="Drawing color">
                    <input id="drawing-size" type="range" min="1" max="24" value="4" aria-label="Brush size">
                    <button class="tool-button" id="undo-drawing" type="button" title="Undo last stroke">Undo</button>
                    <button class="tool-button" id="clear-drawing" type="button" title="Clear this page's drawing">Clear</button>
                  </div>
                  <canvas id="analyzer-drawing-canvas" aria-label="Finite drawing space beside the document"></canvas>
                </div>
              </aside>

              <div class="analyzer-pdf-stage" id="analyzer-pdf-stage" hidden>
                <canvas id="analyzer-pdf-canvas"></canvas>
                <div class="highlight-layer is-drawing-mode" id="pdf-highlight-layer" aria-label="PDF highlight layer"></div>
              </div>

              <aside class="analyzer-comment-rail" id="analyzer-comment-rail" aria-label="Comments beside the document" hidden>
                <button class="tool-button analyzer-comment-visibility" id="side-comments-visibility" type="button" aria-pressed="true">Hide comments</button>
                <div class="analyzer-comment-rail-list" id="analyzer-comment-rail-list"></div>
              </aside>
            </div>
          </div>
          <div class="analyzer-page-controls" aria-label="PDF page navigation" hidden>
            <button class="tool-button" id="analysis-previous-page" type="button" disabled>← Previous</button>
            <span class="zoom-value" id="analysis-page-count">Page 0 / 0</span>
            <button class="tool-button" id="analysis-next-page" type="button" disabled>Next →</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../vendor/pdf.min.js"></script>
  <script src="../vendor/pdf-lib.min.js"></script>
  <script type="module" src="literature-analyzer.js?v=8"></script>
</body>
</html>
